<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin</title>
  <link rel="stylesheet" href="/panel/static/panel.css">
</head>
<body>
  <section id="login" class="gate">
    <div class="gate-card">
      <p class="eyebrow">Community bot</p>
      <h1>Sign in</h1>
      <p class="muted">Tap the button and sign in with the Telegram account you use to manage this bot.</p>
      <div id="tg-login"></div>
      <form id="pin-form" hidden>
        <label>Owner PIN
          <input id="pin" type="password" autocomplete="current-password">
        </label>
        <button class="primary" type="submit">Continue</button>
      </form>
      <p id="login-error" class="error"></p>
    </div>
  </section>
  <div id="app" class="shell" hidden>
    <aside class="side">
      <p class="side-brand">Community bot</p>
      <p class="who" id="who"></p>
      <nav id="nav"></nav>
    </aside>
    <div class="workspace">
      <header class="bar">
        <button id="menu" class="menu-btn" type="button">Menu</button>
        <div class="bar-title">
          <h1 id="title">Home</h1>
          <p id="lead" class="muted"></p>
        </div>
        <button id="logout" type="button">Log out</button>
      </header>
      <div id="scrim" class="scrim"></div>
      <div id="view"></div>
    </div>
  </div>
  <script src="/panel/static/panel.js"></script>
</body>
</html>
