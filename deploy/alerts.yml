groups:
  - name: bot
    rules:
      - alert: ProcessDown
        expr: up == 0
        for: 2m
        labels: {severity: critical}
      - alert: QueueBacklog
        expr: rabbitmq_queue_messages_ready > 50000
        for: 5m
        labels: {severity: warning}
      - alert: DeliveryNeedsReview
        expr: automation_job_count{state=~"DEAD|UNKNOWN"} > 0
        for: 1m
        labels: {severity: warning}
      - alert: DatabaseJobsOld
        expr: automation_oldest_pending_seconds > 600
        for: 5m
        labels: {severity: warning}
      - alert: LowDiskSpace
        expr: disk_free_bytes / disk_total_bytes < 0.15
        for: 5m
        labels: {severity: critical}
