global:
  scrape_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: automation
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [app:9091, worker:9091, broadcast-worker:9091]
  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]
