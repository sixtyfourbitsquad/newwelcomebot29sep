name: telegram-community-bot

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tg_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tg_bot}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tg_bot} -d ${POSTGRES_DB:-tg_bot}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment: &runtime
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-tg_bot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tg_bot}
      REDIS_URL: redis://redis:6379/0
      RUN_EMBEDDED_WORKERS: "false"
      WEBHOOK_REGISTER_ON_STARTUP: "true"
    volumes: &app-volumes
      - ./storage:/app/storage
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging: *logging

  admin:
    profiles: ["web-admin"]
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *runtime
      WEBHOOK_REGISTER_ON_STARTUP: "false"
    volumes: *app-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging: *logging

  broadcast-worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "workers.standalone", "broadcast"]
    env_file:
      - .env
    environment:
      <<: *runtime
      WEBHOOK_REGISTER_ON_STARTUP: "false"
    volumes: *app-volumes
    depends_on:
      app:
        condition: service_healthy
    healthcheck: &worker-health
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0 if os.path.exists('/tmp/worker-alive') else 1)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    logging: *logging

  scheduler-worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "workers.standalone", "scheduler"]
    env_file:
      - .env
    environment:
      <<: *runtime
      WEBHOOK_REGISTER_ON_STARTUP: "false"
    volumes: *app-volumes
    depends_on:
      app:
        condition: service_healthy
    healthcheck: *worker-health
    logging: *logging

  onboarding-worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "workers.standalone", "onboarding"]
    env_file:
      - .env
    environment:
      <<: *runtime
      WEBHOOK_REGISTER_ON_STARTUP: "false"
    volumes: *app-volumes
    depends_on:
      app:
        condition: service_healthy
    healthcheck: *worker-health
    logging: *logging

  retention-worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "workers.standalone", "retention"]
    env_file:
      - .env
    environment:
      <<: *runtime
      WEBHOOK_REGISTER_ON_STARTUP: "false"
    volumes: *app-volumes
    depends_on:
      app:
        condition: service_healthy
    healthcheck: *worker-health
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEBHOOK_HOST: ${WEBHOOK_HOST:-localhost}
      ADMIN_HOST: ${ADMIN_HOST:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
